# Local development services: PostgreSQL 16 and Redis 8 (L2 §10.2, §14.1).
# Usage: npm run dev:secrets (once), then npm run dev:up / dev:down / dev:reset — see docs/WORKFLOW.md.
# Ports are bound to 127.0.0.1 so the services are never reachable from the network.
# Host ports: POSTGRES_HOST_PORT / REDIS_HOST_PORT from the shell environment (Compose does not read the root .env).
name: secure360-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Bootstrap superuser: used by the init script only, never by the application.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      POSTGRES_DB: secure360
      # Password auth on the socket and loopback too, so even `docker exec … psql` needs a password.
      # Read by initdb only: changing it needs npm run dev:reset.
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    secrets:
      - pg_superuser_password
      - db_owner_password
      - db_app_password
      - db_worker_password
      - db_metrics_password
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'secure360']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # The entrypoint writes requirepass to a private config file at start, so the password never
    # appears in the container command line, its environment or `docker inspect`.
    entrypoint: ['/bin/sh', '/usr/local/bin/redis-entrypoint.sh']
    command:
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - noeviction
    secrets:
      - redis_password
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
      - ./redis/entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    healthcheck:
      # $$ stops Compose from interpolating; the shell inside the container expands it.
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli --no-auth-warning ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

secrets:
  pg_superuser_password:
    file: ./secrets/pg_superuser_password
  db_owner_password:
    file: ./secrets/db_owner_password
  db_app_password:
    file: ./secrets/db_app_password
  db_worker_password:
    file: ./secrets/db_worker_password
  db_metrics_password:
    file: ./secrets/db_metrics_password
  redis_password:
    file: ./secrets/redis_password

volumes:
  pg_data:
  redis_data:
