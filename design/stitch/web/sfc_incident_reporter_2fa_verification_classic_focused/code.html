<body class="min-h-full flex flex-col justify-center items-center p-4 antialiased text-sfc-textPrimary bg-sfc-bg">

</div>
<!-- BEGIN: CardHeader -->

</div>
<!-- Platform Title -->
<h2 class="text-[24px] font-bold text-sfc-textPrimary tracking-tight text-center mt-3">Two-step verification</h2>

<input class="code-input w-[48px] h-[56px] rounded-[8px] border-2 border-sfc-border text-[22px] font-bold text-center text-sfc-textPrimary font-mono" data-index="1" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
<input class="code-input w-[48px] h-[56px] rounded-[8px] border-2 border-sfc-border text-[22px] font-bold text-center text-sfc-textPrimary font-mono" data-index="2" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">

<input class="code-input w-[48px] h-[56px] rounded-[8px] border-2 border-sfc-border text-[22px] font-bold text-center text-sfc-textPrimary font-mono" data-index="4" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
<input class="code-input w-[48px] h-[56px] rounded-[8px] border-2 border-sfc-border text-[22px] font-bold text-center text-sfc-textPrimary font-mono" data-index="5" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">

<circle cx="12" cy="12" r="9"></circle>

  Verify
</button><div class="text-center mt-4 pt-1"><p class="text-[13px] text-sfc-textMuted">Lost access to your app? <a href="#support" class="text-sfc-navy hover:underline font-medium">Ask an administrator</a> to reset your 2-step verification.</p></div>

</form>

</main>

<!-- BEGIN: Script Interactions -->
<script data-purpose="2fa-input-controller">
  const inputs = Array.from(document.querySelectorAll('#otp-container input'));
  const form = document.getElementById('2fa-form');
  const verifyBtn = document.getElementById('verify-btn');
  const statusMessage = document.getElementById('status-message');
  const statusText = document.getElementById('status-text');
  const resendBtn = document.getElementById('resend-btn');
  const resendTimer = document.getElementById('resend-timer');

  // Input events: Auto-advance, backspace handling, digit validation
  inputs.forEach((input, index) => {
    input.addEventListener('input', (e) => {
      const val = e.target.value.replace(/[^0-9]/g, '');
      e.target.value = val ? val.slice(-1) : '';
      clearErrors();

      if (e.target.value && index < inputs.length - 1) {
        inputs[index + 1].focus();
        inputs[index + 1].select();
      }

      checkAndAutoSubmit();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace') {
        if (!e.target.value && index > 0) {
          inputs[index - 1].focus();
          inputs[index - 1].value = '';
          clearErrors();
        }
      } else if (e.key === 'ArrowLeft' && index > 0) {
        inputs[index - 1].focus();
      } else if (e.key === 'ArrowRight' && index < inputs.length - 1) {
        inputs[index + 1].focus();
      }
    });

    // Paste event support (spread 6 digits)
    input.addEventListener('paste', (e) => {
      e.preventDefault();
      const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim();
      const digits = pasteData.replace(/[^0-9]/g, '').slice(0, 6);
      if (digits.length > 0) {
        digits.split('').forEach((char, idx) => {
          if (inputs[idx]) {
            inputs[idx].value = char;
          }
        });
        clearErrors();
        const nextFocusIndex = Math.min(digits.length, inputs.length - 1);
        inputs[nextFocusIndex].focus();
        checkAndAutoSubmit();
      }
    });
  });

  function clearErrors() {
    inputs.forEach(i => i.classList.remove('input-error'));
    statusMessage.classList.add('hidden');
    statusMessage.classList.remove('text-sfc-success');
    statusMessage.classList.add('text-sfc-error');
  }

  function getCode() {
    return inputs.map(i => i.value.trim()).join('');
  }

  function checkAndAutoSubmit() {
    const code = getCode();
    if (code.length === 6) {
      handleVerify();
    }
  }

  function handleVerify() {
    const code = getCode();
    if (code.length < 6) {
      showError('Please enter all 6 digits of the verification code.');
      return;
    }

    verifyBtn.disabled = true;
    verifyBtn.innerHTML = `
      <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      Verifying...
    `;

    setTimeout(() => {
      verifyBtn.disabled = false;
      verifyBtn.innerHTML = 'Verify';

      // Demo verification logic: "000000" triggers error, other codes pass
      if (code === '000000') {
        showError('Invalid code. Please check your authenticator and try again.');
      } else {
        // Success state redirect simulation to W04
        statusMessage.classList.remove('hidden', 'text-sfc-error');
        statusMessage.classList.add('text-sfc-success');
        statusMessage.innerHTML = `
          <svg class="w-4 h-4 shrink-0 text-sfc-success" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>Identity verified! Redirecting to Dashboard (W04)...</span>
        `;
        inputs.forEach(i => {
          i.classList.remove('input-error');
          i.classList.add('border-emerald-500', 'bg-emerald-50/50');
        });
        setTimeout(() => {
          window.location.hash = '#dashboard-w04';
        }, 1200);
      }
    }, 600);
  }

  function showError(msg) {
    inputs.forEach(i => i.classList.add('input-error'));
    statusMessage.classList.remove('hidden');
    statusText.textContent = msg;
    const firstEmpty = inputs.find(i => !i.value) || inputs[0];
    firstEmpty.focus();
    firstEmpty.select();
  }

  // Resend Timer countdown
  let countdown = 45;
  const timerInterval = setInterval(() => {
    countdown--;
    if (countdown > 0) {
      resendTimer.textContent = `${countdown}s`;
    } else {
      clearInterval(timerInterval);
      resendBtn.disabled = false;
      resendBtn.classList.remove('cursor-not-allowed');
      resendBtn.classList.add('hover:text-sfc-navy', 'hover:underline', 'cursor-pointer');
      resendBtn.textContent = 'Resend Code';
    }
  }, 1000);

  resendBtn.addEventListener('click', () => {
    if (countdown <= 0) {
      alert('A new 6-digit code has been dispatched to your authenticator application.');
      countdown = 45;
      resendBtn.disabled = true;
      resendBtn.classList.add('cursor-not-allowed');
      resendBtn.classList.remove('hover:text-sfc-navy', 'hover:underline', 'cursor-pointer');
      resendBtn.innerHTML = `Resend code in <span id="resend-timer" class="font-semibold">45s</span>`;
    }
  });

  // Test helper function
  window.fillTestCode = function(codeStr) {
    codeStr.split('').forEach((char, idx) => {
      if (inputs[idx]) inputs[idx].value = char;
    });
    clearErrors();
    checkAndAutoSubmit();
  };
</script>
<!-- END: Script Interactions -->


</body></html>
