<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "inverse-on-surface": "#f1f0f5", "surface-dim": "#dad9de", "surface-container-high": "#e8e8ed", "background": "#ffffff", "on-primary-fixed": "#001b3c", "tertiary-fixed-dim": "#ffb690", "outline-variant": "#c3c6d1", "surface-container-low": "#f4f3f8", "on-tertiary-fixed": "#341100", "secondary": "#566068", "on-secondary-fixed-variant": "#3e4850", "outline": "#737780", "on-surface-variant": "#43474f", "on-error-container": "#93000a", "on-primary-container": "#799dd6", "surface-container-lowest": "#ffffff", "secondary-container": "#dae4ee", "on-secondary": "#ffffff", "tertiary-container": "#592300", "text-primary": "#1e1e1e", "tertiary-fixed": "#ffdbca", "secondary-fixed-dim": "#bec8d1", "on-tertiary": "#ffffff", "on-background": "#1a1c1f", "border": "#e0e0e0", "tertiary": "#381300", "danger": "#cc0000", "on-tertiary-container": "#d8885c", "primary-fixed": "#d5e3ff", "inverse-surface": "#2f3034", "surface-container": "#eeedf2", "on-surface": "#1a1c1f", "surface-variant": "#e2e2e7", "error-container": "#ffdad6", "surface-tint": "#3a5f94", "surface": "#f8f9fc", "surface-container-highest": "#e2e2e7", "success": "#006633", "secondary-fixed": "#dae4ee", "on-primary": "#ffffff", "inverse-primary": "#a7c8ff", "primary": "#001e40", "error": "#ba1a1a", "surface-bright": "#f9f9fe", "text-secondary": "#666666", "on-error": "#ffffff", "primary-fixed-dim": "#a7c8ff", "on-primary-fixed-variant": "#1f477b", "primary-container": "#003366", "on-tertiary-fixed-variant": "#723610", "on-secondary-fixed": "#131d24", "on-secondary-container": "#5c666e" }, borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, spacing: { "gutter": "1rem", "space-xl": "2rem", "space-md": "1rem", "space-xs": "0.25rem", "space-lg": "1.5rem", "margin": "1rem", "space-sm": "0.5rem" }, fontFamily: { "headline-sm": ["Inter"], "caption": ["Inter"], "body-sm": ["Inter"], "headline-lg": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"] }, fontSize: { "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "700" }] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;}body{overscroll-behavior-y:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased"><header class="fixed top-0 w-full z-50 bg-primary-container text-on-primary shadow-[0_1px_8px_rgba(0,0,0,0.08)] pt-safe"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Go Back" class="w-12 h-12 -ml-2 rounded-lg flex items-center justify-center text-on-primary hover:bg-white/10 active:bg-white/20 transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><div class="flex flex-col justify-center min-w-0"><h1 class="font-headline-sm text-headline-sm text-on-primary truncate tracking-tight">Report An Incident</h1><span class="font-caption text-caption text-primary-fixed-dim leading-none">Step 1 of 3 • Incident Intake</span></div></div><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full">
<!-- Sub-Category Header Hero Banner -->
<div class="w-full bg-primary-container px-margin pt-space-md pb-space-lg shadow-sm">
<div class="flex items-center gap-space-sm mb-space-sm">
<div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-primary-fixed/20">
<span class="w-2 h-2 rounded-full bg-primary-fixed-dim"></span>
<span class="font-caption text-caption text-primary-fixed tracking-wide font-medium">Step 1 of 3</span>
</div>
<span class="font-caption text-caption text-primary-fixed-dim tracking-normal">Categorization</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-primary tracking-tight">Fraud &amp; scams</h2>
<p class="font-body-md text-body-md text-primary-fixed-dim mt-1">Which one fits your situation best?</p>
</div>
<!-- Content Container -->
<div class="px-margin py-space-md flex flex-col gap-space-md">
<!-- Situation Selection List -->
<fieldset aria-label="Select incident sub-category" class="flex flex-col gap-3">
<!-- Option 1: Online scam attempt -->
<label class="group relative flex items-start gap-3 p-4 rounded-xl bg-surface-container-lowest shadow-sm cursor-pointer transition-all active:scale-[0.99]" onclick="selectCard(this)">
<input class="sr-only" name="incident_subcategory" type="radio" value="online_scam"/>
<div class="w-11 h-11 rounded-full bg-surface-container-low flex items-center justify-center shrink-0 text-on-surface-variant transition-colors group-[.is-selected]:bg-primary-container group-[.is-selected]:text-on-primary">
<span class="material-symbols-outlined text-[24px]">public_off</span>
</div>
<div class="flex-1 min-w-0 pr-2">
<div class="font-headline-sm text-body-md font-semibold text-text-primary tracking-tight group-[.is-selected]:text-primary transition-colors">
            Online scam attempt
          </div>
<p class="font-body-sm text-body-sm text-text-secondary mt-0.5 leading-snug">
            Someone tried to trick you on the internet
          </p>
</div>
<div class="w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center shrink-0 mt-0.5 transition-all group-[.is-selected]:bg-primary-container">
<span class="material-symbols-outlined text-on-primary text-[16px] scale-0 group-[.is-selected]:scale-100 transition-transform">check</span>
</div>
</label>
<!-- Option 2: Fake website imitating an official service -->
<label class="group relative flex items-start gap-3 p-4 rounded-xl bg-surface-container-lowest shadow-sm cursor-pointer transition-all active:scale-[0.99]" onclick="selectCard(this)">
<input class="sr-only" name="incident_subcategory" type="radio" value="fake_website"/>
<div class="w-11 h-11 rounded-full bg-surface-container-low flex items-center justify-center shrink-0 text-on-surface-variant transition-colors group-[.is-selected]:bg-primary-container group-[.is-selected]:text-on-primary">
<span class="material-symbols-outlined text-[24px]">web_asset_off</span>
</div>
<div class="flex-1 min-w-0 pr-2">
<div class="font-headline-sm text-body-md font-semibold text-text-primary tracking-tight group-[.is-selected]:text-primary transition-colors">
            Fake website imitating an official service
          </div>
<p class="font-body-sm text-body-sm text-text-secondary mt-0.5 leading-snug">
            A site that looks like your bank, the tax office, or an operator…
          </p>
</div>
<div class="w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center shrink-0 mt-0.5 transition-all group-[.is-selected]:bg-primary-container">
<span class="material-symbols-outlined text-on-primary text-[16px] scale-0 group-[.is-selected]:scale-100 transition-transform">check</span>
</div>
</label>
<!-- Option 3: Mobile Money fraud (Default Selected) -->
<label class="group is-selected relative flex items-start gap-3 p-4 rounded-xl bg-secondary-container shadow-md cursor-pointer transition-all active:scale-[0.99]" onclick="selectCard(this)">
<input checked="" class="sr-only" name="incident_subcategory" type="radio" value="mobile_money"/>
<div class="w-11 h-11 rounded-full bg-primary-container text-on-primary flex items-center justify-center shrink-0 transition-colors">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">phone_iphone</span>
</div>
<div class="flex-1 min-w-0 pr-2">
<div class="flex items-center gap-2">
<span class="font-headline-sm text-body-md font-semibold text-primary tracking-tight">
              Mobile Money fraud
            </span>
</div>
<span class="inline-block font-caption text-caption text-on-primary-fixed-variant font-medium mt-0.5">
            Orange Money, MTN MoMo
          </span>
<p class="font-body-sm text-body-sm text-on-secondary-fixed-variant mt-1 leading-snug">
            Unknown withdrawal, request for your PIN, or fake transaction alerts
          </p>
</div>
<div class="w-6 h-6 rounded-full bg-primary-container flex items-center justify-center shrink-0 mt-0.5 transition-all">
<span class="material-symbols-outlined text-on-primary text-[16px] scale-100 transition-transform">check</span>
</div>
</label>
<!-- Option 4: Digital identity theft -->
<label class="group relative flex items-start gap-3 p-4 rounded-xl bg-surface-container-lowest shadow-sm cursor-pointer transition-all active:scale-[0.99]" onclick="selectCard(this)">
<input class="sr-only" name="incident_subcategory" type="radio" value="identity_theft"/>
<div class="w-11 h-11 rounded-full bg-surface-container-low flex items-center justify-center shrink-0 text-on-surface-variant transition-colors group-[.is-selected]:bg-primary-container group-[.is-selected]:text-on-primary">
<span class="material-symbols-outlined text-[24px]">badge</span>
</div>
<div class="flex-1 min-w-0 pr-2">
<div class="font-headline-sm text-body-md font-semibold text-text-primary tracking-tight group-[.is-selected]:text-primary transition-colors">
            Digital identity theft
          </div>
<p class="font-body-sm text-body-sm text-text-secondary mt-0.5 leading-snug">
            Someone is using your name, photo, or official documents
          </p>
</div>
<div class="w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center shrink-0 mt-0.5 transition-all group-[.is-selected]:bg-primary-container">
<span class="material-symbols-outlined text-on-primary text-[16px] scale-0 group-[.is-selected]:scale-100 transition-transform">check</span>
</div>
</label>
</fieldset>
<!-- Reassurance / Trust Card -->
<div class="p-3.5 rounded-xl bg-surface-container-high flex items-center gap-3">
<div class="w-9 h-9 rounded-full bg-surface-container-lowest flex items-center justify-center shrink-0 text-primary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
</div>
<p class="font-caption text-caption text-on-surface-variant flex-1 leading-relaxed">
        Confidential and reviewed directly by <strong class="text-on-surface font-semibold">Security First Cameroon</strong> analysts.
      </p>
</div>
<!-- Actions Area -->
<div class="flex flex-col gap-space-sm pt-space-xs pb-space-lg">
<button class="w-full h-12 rounded-lg bg-primary-container text-on-primary font-headline-sm text-body-md font-semibold flex items-center justify-center gap-2 shadow-sm hover:opacity-95 active:scale-[0.99] transition-all" type="button">
<span>Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<button class="w-full py-2 flex items-center justify-center gap-1.5 text-primary hover:text-on-primary-fixed-variant transition-colors group" type="button">
<span class="font-body-sm text-body-sm font-medium">Not sure? Choose "Something else"</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-0.5 transition-transform">chevron_right</span>
</button>
</div>
</div>
</div>
<script>
  function selectCard(cardElement) {
    const fieldset = cardElement.closest('fieldset');
    if (!fieldset) return;
    
    // Clear selection state on siblings
    const allCards = fieldset.querySelectorAll('label');
    allCards.forEach(card => {
      card.classList.remove('is-selected', 'bg-secondary-container', 'shadow-md');
      card.classList.add('bg-surface-container-lowest', 'shadow-sm');
      const radio = card.querySelector('input[type="radio"]');
      if (radio) radio.checked = false;

      // Update indicator circle styling
      const iconWrap = card.querySelector('div:first-of-type');
      if (iconWrap) {
        iconWrap.classList.remove('bg-primary-container', 'text-on-primary');
        iconWrap.classList.add('bg-surface-container-low', 'text-on-surface-variant');
      }

      const checkWrap = card.querySelector('div:last-of-type');
      if (checkWrap) {
        checkWrap.classList.remove('bg-primary-container');
        checkWrap.classList.add('bg-surface-container-highest');
      }
    });

    // Apply active selection state
    cardElement.classList.add('is-selected', 'bg-secondary-container', 'shadow-md');
    cardElement.classList.remove('bg-surface-container-lowest', 'shadow-sm');
    
    const radioInput = cardElement.querySelector('input[type="radio"]');
    if (radioInput) radioInput.checked = true;

    const iconWrap = cardElement.querySelector('div:first-of-type');
    if (iconWrap) {
      iconWrap.classList.add('bg-primary-container', 'text-on-primary');
      iconWrap.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
    }

    const checkWrap = cardElement.querySelector('div:last-of-type');
    if (checkWrap) {
      checkWrap.classList.add('bg-primary-container');
      checkWrap.classList.remove('bg-surface-container-highest');
    }
  }
</script></main></body></html>
