<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "inverse-on-surface": "#f1f0f5", "surface-dim": "#dad9de", "surface-container-high": "#e8e8ed", "background": "#ffffff", "on-primary-fixed": "#001b3c", "tertiary-fixed-dim": "#ffb690", "outline-variant": "#c3c6d1", "surface-container-low": "#f4f3f8", "on-tertiary-fixed": "#341100", "secondary": "#566068", "on-secondary-fixed-variant": "#3e4850", "outline": "#737780", "on-surface-variant": "#43474f", "on-error-container": "#93000a", "on-primary-container": "#799dd6", "surface-container-lowest": "#ffffff", "secondary-container": "#dae4ee", "on-secondary": "#ffffff", "tertiary-container": "#592300", "text-primary": "#1e1e1e", "tertiary-fixed": "#ffdbca", "secondary-fixed-dim": "#bec8d1", "on-tertiary": "#ffffff", "on-background": "#1a1c1f", "border": "#e0e0e0", "tertiary": "#381300", "danger": "#cc0000", "on-tertiary-container": "#d8885c", "primary-fixed": "#d5e3ff", "inverse-surface": "#2f3034", "surface-container": "#eeedf2", "on-surface": "#1a1c1f", "surface-variant": "#e2e2e7", "error-container": "#ffdad6", "surface-tint": "#3a5f94", "surface": "#f8f9fc", "surface-container-highest": "#e2e2e7", "success": "#006633", "secondary-fixed": "#dae4ee", "on-primary": "#ffffff", "inverse-primary": "#a7c8ff", "primary": "#001e40", "error": "#ba1a1a", "surface-bright": "#f9f9fe", "text-secondary": "#666666", "on-error": "#ffffff", "primary-fixed-dim": "#a7c8ff", "on-primary-fixed-variant": "#1f477b", "primary-container": "#003366", "on-tertiary-fixed-variant": "#723610", "on-secondary-fixed": "#131d24", "on-secondary-container": "#5c666e" }, borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, spacing: { "gutter": "1rem", "space-xl": "2rem", "space-md": "   </head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased"><header class="fixed top-0 w-full z-50 bg-primary-container text-on-primary shadow-[0_1px_8px_rgba(0,0,0,0.08)] pt-safe"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Go Back" class="w-12 h-12 -ml-2 rounded-lg flex items-center justify-center text-on-primary hover:bg-white/10 active:bg-white/20 transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><div class="flex flex-col justify-center min-w-0"><h1 class="font-headline-sm text-headline-sm text-on-primary truncate tracking-tight">Report An Incident</h1><span class="font-caption text-caption text-primary-fixed-dim leading-none">Step 1 of 3 • Incident Intake</span></div></div><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full">
<div class="bg-primary-container px-margin pt-space-md pb-space-lg shadow-sm">
<div class="flex items-center justify-between mb-space-sm">
<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-primary-fixed/20 text-on-primary font-caption text-caption">
<span class="w-2 h-2 rounded-full bg-primary-fixed animate-pulse"></span>
        Step 1 of 3
      </span>
<span class="font-caption text-caption text-primary-fixed-dim tracking-wide">
        Incident Intake
      </span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-primary tracking-tight">
      My phone
    </h2>
<p class="font-body-sm text-body-sm text-primary-fixed-dim mt-1">
      Which one fits best? We will walk you through the rest.
    </p>
</div>
<div class="px-margin py-space-lg flex flex-col gap-space-md">
<fieldset aria-label="Incident type selection" class="flex flex-col gap-space-sm m-0 p-0">
<label class="group relative flex items-center justify-between p- space-md rounded-xl bg-surface-container-lowest shadow-sm cursor-pointer transition-all active:scale-[0.99] select-none">
<input class="peer sr-only" name="incident_sub_type" onchange="handleSelect(this)" type="radio" value="suspicious_app"/>
<div class="flex items-start gap-3.5 pr-2 min-w-0">
<div class="w-11 h-11 rounded-full bg-surface-container-low flex items-center justify-center flex-shrink-0 text-primary group-hover:bg-primary-fixed/30 transition-colors">
<span class="material-symbols-outlined text-[22px]">install_mobile</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-body-md text-text-primary tracking-tight leading-snug">
              Suspicious mobile application installed
            </span>
<span class="font-body-sm text-body-sm text-text-secondary mt-0.5 leading-tight">
              e.g. a loan app asking for your contacts
            </span>
</div>
</div>
<div class="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 bg-surface-container transition-all peer-checked:bg-primary text-transparent peer-checked:text-on-primary">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
<div class="absolute inset-0 rounded-xl pointer-events-none transition-all peer-checked:bg-primary/[0.04]"></div>
</label>
<label class="group relative flex items-center justify-between p-space-md rounded-xl bg-surface-container-lowest shadow-sm cursor-pointer transition-all active:scale-[0.99] select-none">
<input checked="" class="peer sr-only" name="incident_sub_type" onchange="handleSelect(this)" type="radio" value="sim_swap"/>
<div class="flex items-start gap-3.5 pr-2 min-w-0">
<div class="w-11 h-11 rounded-full bg-error-container flex items-center justify-center flex-shrink-0 text-error group-hover:bg-error-container/80 transition-colors">
<span class="material-symbols-outlined text-[22px]">signal_cellular_connected_no_internet_0_bar</span>
</div>
<div class="flex flex-col min-w-0">
<div class="flex items-center gap-2 flex-wrap">
<span class="font-headline-sm text-body-md text-text-primary tracking-tight leading-snug">
                Sudden loss of mobile network / suspected SIM swap
              </span>
<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-error-container text-danger font-caption text-caption font-semibold">
<span class="material-symbols-outlined text-[13px]">warning</span>
                Urgent
              </span>
</div>
<span class="font-body-sm text-body-sm text-text-secondary mt-1 leading-tight">
              Your phone shows 'No service' and you didn't do anything
            </span>
</div>
</div>
<div class="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 bg-surface-container transition-all peer-checked:bg-primary text-transparent peer-checked:text-on-primary">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
<div class="absolute inset-0 rounded-xl pointer-events-none transition-all peer-checked:bg-danger/[0.03]"></div>
</label>
<label class="group relative flex items-center justify-between p-space-md rounded-xl bg-surface-container-lowest shadow-sm cursor-pointer transition-all active:scale-[0.99] select-none">
<input class="peer sr-only" name="incident_sub_type" onchange="handleSelect(this)" type="radio" value="suspicious_call"/>
<div class="flex items-start gap-3.5 pr-2 min-w-0">
<div class="w-11 h-11 rounded-full bg-surface-container-low flex items-center justify-center flex-shrink-0 text-primary group-hover:bg-primary-fixed/30 transition-colors">
<span class="material-symbols-outlined text-[22px]">phone_in_talk</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-body-md text-text-primary tracking-tight leading-snug">
              Suspicious call asking for information
            </span>
<span class="font-body-sm text-body-sm text-text-secondary mt-0.5 leading-tight">
              Someone claiming to be your operator, bank, or manager
            </span>
</div>
</div>
<div class="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 bg-surface-container transition-all peer-checked:bg-primary text-transparent peer-checked:text-on-primary">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
<div class="absolute inset-0 rounded-xl pointer-events-none transition-all peer-checked:bg-primary/[0.04]"></div>
</label>
<label class="group relative flex items-center justify-between p-space-md rounded-xl bg-surface-container-lowest shadow-sm cursor-pointer transition-all active:scale-[0.99] select-none">
<input class="peer sr-only" name="incident_sub_type" onchange="handleSelect(this)" type="radio" value="suspicious_qr"/>
<div class="flex items-start gap-3.5 pr-2 min-w-0">
<div class="w-11 h-11 rounded-full bg-surface-container-low flex items-center justify-center flex-shrink-0 text-primary group-hover:bg-primary-fixed/30 transition-colors">
<span class="material-symbols-outlined text-[22px]">qr_code_scanner</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-body-md text-text-primary tracking-tight leading-snug">
              Suspicious QR code scanned
            </span>
<span class="font-body-sm text-body-sm text-text-secondary mt-0.5 leading-tight">
              A QR code that opened an unexpected webpage or download
            </span>
</div>
</div>
<div class="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 bg-surface-container transition-all peer-checked:bg-primary text-transparent peer-checked:text-on-primary">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
<div class="absolute inset-0 rounded-xl pointer-events-none transition-all peer-checked:bg-primary/[0.04]"></div>
</label>
</fieldset>
<div class="flex items-start gap-3 p-space-md rounded-xl bg-secondary-container/40 text-on-surface">
<span class="material-symbols-outlined text-primary text-[20px] mt-0.5 flex-shrink-0">info</span>
<p class="font-body-sm text-body-sm text-on-secondary-fixed-variant leading-relaxed">
        If your SIM card stopped working suddenly, report immediately so SFC can notify your mobile carrier.
      </p>
</div>
<div class="flex flex-col gap-space-sm pt-space-xs pb-space-lg">
<button class="w-full h-12 flex items-center justify-center gap-2 rounded-lg bg-primary-container text-on-primary font-headline-sm text-body-md shadow-sm active:bg-primary transition-all" id="continue-btn" type="button">
<span>Continue</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<button class="w-full h-11 flex items-center justify-center text-center font-body-sm text-body-sm text-primary hover:underline active:opacity-75 transition-opacity" type="button">
        Not sure? Choose 'Something else'
      </button>
</div>
</div>
</div>
<script>
  function handleSelect(radio) {
    const btn = document.getElementById('continue-btn');
    if (btn) {
      btn.classList.add('scale-[0.98]');
      setTimeout(() => btn.classList.remove('scale-[0.98]'), 120);
    }
  }
</script></main></body></html>
