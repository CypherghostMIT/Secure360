<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>SFC Incident Reporter</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#003366",
            "background-light": "#ffffff",
            "background-dark": "#0B1120",
          },
          fontFamily: {
            display: ["Inter", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "0.75rem",
          },
          keyframes: {
            pulseBounce: {
              '0%, 100%': { transform: 'scale(0.85)', opacity: '0.35' },
              '50%': { transform: 'scale(1.25)', opacity: '1' },
            }
          },
          animation: {
            'dot-1': 'pulseBounce 1.4s ease-in-out infinite',
            'dot-2': 'pulseBounce 1.4s ease-in-out infinite 0.2s',
            'dot-3': 'pulseBounce 1.4s ease-in-out infinite 0.4s',
          }
        },
      },
    };
  </script>
<style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="h-full w-full overflow-hidden flex flex-col justify-between items-center relative select-none" style="background-color: #003366; min-height: 100vh;">
<main class="flex-1 flex flex-col items-center justify-center w-full px-6 text-center select-none" id="splashContent"><div class="flex flex-col items-center justify-center"><div class="w-24 h-24 mb-6 flex items-center justify-center"><svg class="w-24 h-24 drop-shadow-md" fill="none" viewbox="0 0 100 115" xmlns="http://www.w3.org/2000/svg"><path d="M50 4L12 20.8V53.8C12 79.4 28.2 103.2 50 110C71.8 103.2 88 79.4 88 53.8V20.8L50 4Z" fill="rgba(255, 255, 255, 0.08)" stroke="#ffffff" stroke-linejoin="round" stroke-width="6"></path><text fill="#ffffff" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5" text-anchor="middle" x="50" y="64">360</text></svg></div><h1 style="font-size: 28px; line-height: 34px; font-weight: 700; color: #ffffff; letter-spacing: -0.02em; font-family: 'Inter', Roboto, sans-serif;">Secure360</h1><p class="mt-2 font-normal" style="font-size: 14px; line-height: 20px; color: #A7C8FF; font-family: 'Inter', Roboto, sans-serif;">by Security First Cameroon</p></div></main>
<footer class="w-full pb-12 flex flex-col items-center justify-center gap-3 select-none pointer-events-none"><div class="w-[120px] h-1 bg-white/20 rounded-full overflow-hidden relative"><div class="absolute inset-0 bg-white rounded-full animate-pulse" style="width: 45%; animation: indeterminate 1.6s infinite ease-in-out;"></div></div><span style="font-size: 12px; line-height: 16px; color: #A7C8FF; font-family: 'Inter', Roboto, sans-serif;">Version 1.0.0</span><style>@keyframes indeterminate { 0% { transform: translateX(-100%); } 50% { transform: translateX(80%); } 100% { transform: translateX(250%); } }</style></footer>
<script>
    // Smooth transition simulation after 2 seconds
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const splash = document.getElementById('splashContent');
        if (splash) {
          splash.classList.add('opacity-90', 'scale-[0.98]');
        }
      }, 2000);
    });
  </script>
</body></html>
