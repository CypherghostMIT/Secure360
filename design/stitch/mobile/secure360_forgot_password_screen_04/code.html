<body class="h-full flex items-center justify-center bg-surface-dim font-body-md text-text-primary antialiased p-0 sm:p-4">
<!-- Mobile Frame strictly 390x844 -->
<main class="w-[390px] h-[844px] bg-background flex flex-col justify-between overflow-y-auto shadow-2xl relative">
<!-- Top Content Area -->
<div class="flex flex-col w-full">
<!-- Top Navigation: Focused View Minimal Back Bar -->
<header class="w-full pt-4 pb-2 px-4 flex items-center justify-between">
<a aria-label="Return to login" class="flex items-center justify-center size-12 -ml-2 rounded-xl text-text-primary hover:bg-surface-container transition-colors" href="#login">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</a>
<div class="text-caption font-semibold tracking-wider text-secondary uppercase">
          Secure360
        </div>
<div class="size-10"></div>
</header>
<!-- Headings -->
<section class="px-5 pt-3 pb-2">
<h1 class="text-headline-lg font-bold text-text-primary leading-tight">
          Forgot password?
        </h1>
<p class="text-body-md text-text-secondary mt-2 leading-relaxed">
          Enter your work e-mail. If an account exists, we will send you a link to choose a new password.
        </p>
</section>
<!-- Form Section -->
<form class="px-5 pt-4 pb-2 flex flex-col gap-4" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-2">
<label class="text-body-sm font-medium text-text-primary" for="work-email">
            Work e-mail
          </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-text-secondary pointer-events-none text-[20px]">
              mail
            </span>
<input class="w-full h-12 pl-11 pr-4 bg-background border border-border rounded-xl text-body-md text-text-primary placeholder:text-outline focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="work-email" name="email" placeholder="name@company.cm" type="email" value="paul.nguema@douala-logistics.cm"/>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full h-12 bg-primary-container hover:bg-primary active:bg-primary text-on-primary font-medium text-body-md rounded-xl flex items-center justify-center transition-colors shadow-sm" type="submit">
          Send link
        </button>
</form>
<!-- Success State Card (Active Notification) -->
<section class="px-5 pt-4 pb-2">
<div class="bg-[#E8F5E9] border border-[#C8E6C9] rounded-xl p-4 flex flex-col gap-3">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-success shrink-0 text-[24px]" style="font-variation-settings: 'FILL' 1;">
              check_circle
            </span>
<div class="flex flex-col">
<h2 class="text-body-sm font-semibold text-text-primary">
                Check your e-mail
              </h2>
<p class="text-body-sm text-text-primary mt-1 leading-snug">
                If an account exists for this address, a link has been sent. It is valid for <span class="font-medium text-success">30 minutes</span>.
              </p>
</div>
</div>
<!-- Secondary Action Inside Card -->
<a class="w-full h-12 mt-1 border border-primary-container bg-transparent hover:bg-primary-container/5 text-primary-container font-medium text-body-md rounded-xl flex items-center justify-center transition-colors" href="#login">
            Back to sign in
          </a>
</div>
</section>
</div>
<!-- Empty Spacer Footer (Replaces previous badge with clean spacer per constraints) -->
<footer class="w-full py-6 flex items-center justify-center">
<div class="w-12 h-1 bg-surface-variant rounded-full"></div>
</footer>
